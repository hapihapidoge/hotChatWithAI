name: Daily AI Q&A Build

on:
  schedule:
    # 08:15 Asia/Shanghai. GitHub cron uses UTC.
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import Q&A submissions from GitHub Issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/import_github_issues.py

      - name: Collect public Q&A automatically
        run: python scripts/collect_public_qa.py

      - name: Build curated AI Q&A site
        run: python scripts/build_site.py

      - name: Commit generated site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/submissions content/auto public/qa.json public/latest.json public/archive.json public/posts
          if git diff --cached --quiet; then
            echo "No generated site changes to commit."
          else
            git commit -m "Build daily AI Q&A site"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
